server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # Single-page site with no client-side routes, so unknown paths get a real 404
    # instead of falling back to index.html (which crawlers treat as a soft 404).
    location / {
        try_files $uri $uri/ =404;
    }

    # CRA emits content-hashed filenames under /static, safe to cache forever
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

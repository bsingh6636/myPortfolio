name: ESLint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: npm run lint

      - name: Show lint result
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.eslint.outcome }}
        run: |
          case "$LINT_OUTCOME" in
            success)
              echo "### ✅ ESLint passed" >> "$GITHUB_STEP_SUMMARY"
              ;;
            failure)
              echo "### ❌ ESLint failed" >> "$GITHUB_STEP_SUMMARY"
              echo "Run npm run lint locally to see the issues, or npm run lint:fix to fix supported issues." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "### ESLint did not run. Check the earlier steps for errors." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
